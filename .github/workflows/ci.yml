name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      # 测试专用环境变量（非生产密钥）
      DATABASE_URL: "sqlite://"
      JWT_SECRET_KEY: ci-test-secret
      RSA_MASTER_KEY: "HBn-QQPaf3YrtQhIIA2UjC4Qsg4zrebAzo2OO9xNEms="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run regression tests
        working-directory: backend
        run: python tests/test_core_flows.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (vue-tsc + vite)
        working-directory: frontend
        run: npm run build
